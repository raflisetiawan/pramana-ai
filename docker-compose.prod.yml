# =============================================================
# Pramana AI — Docker Compose (Production)
# =============================================================
# Untuk deployment ke server RS
# Jalankan: docker compose -f docker-compose.prod.yml up -d
# =============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pramana-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pramana-net
    # Production: no port exposed to host

  redis:
    image: redis:7.2-alpine
    container_name: pramana-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pramana-net

  mock-vclaim:
    build:
      context: ./services/mock-vclaim
      dockerfile: Dockerfile
    container_name: pramana-mock-vclaim
    restart: always
    environment:
      - MOCK_VCLAIM_HOST=0.0.0.0
      - MOCK_VCLAIM_PORT=8001
      - VCLAIM_CONS_ID=${VCLAIM_CONS_ID}
      - VCLAIM_SECRET_KEY=${VCLAIM_SECRET_KEY}
      - VCLAIM_USER_KEY=${VCLAIM_USER_KEY}
      - MOCK_VCLAIM_RESPONSE_DELAY_MS=${MOCK_VCLAIM_RESPONSE_DELAY_MS:-100}
      - MOCK_VCLAIM_ERROR_RATE=${MOCK_VCLAIM_ERROR_RATE:-0.0}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pramana-net

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: pramana-api-gateway
    restart: always
    environment:
      - API_GATEWAY_HOST=0.0.0.0
      - API_GATEWAY_PORT=8000
      - API_GATEWAY_WORKERS=8
      - DEBUG=false
      - LOG_LEVEL=WARNING
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - NLP_ENGINE_INTERNAL_URL=http://nlp-engine:8002
      - ML_ENGINE_INTERNAL_URL=http://ml-engine:8003
      - AUTH_SERVICE_INTERNAL_URL=http://auth-service:8004
      - MOCK_VCLAIM_INTERNAL_URL=http://mock-vclaim:8001
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pramana-net

  nlp-engine:
    build:
      context: ./services/nlp-engine
      dockerfile: Dockerfile
    container_name: pramana-nlp-engine
    restart: always
    environment:
      - NLP_ENGINE_HOST=0.0.0.0
      - NLP_ENGINE_PORT=8002
      - NLP_ENGINE_WORKERS=4
      - NLP_CONFIDENCE_THRESHOLD=0.75
      - NLP_MAX_TOKEN_LENGTH=512
      - NLP_TOP_K_CANDIDATES=5
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - pramana-net

  ml-engine:
    build:
      context: ./services/ml-engine
      dockerfile: Dockerfile
    container_name: pramana-ml-engine
    restart: always
    environment:
      - ML_ENGINE_HOST=0.0.0.0
      - ML_ENGINE_PORT=8003
      - ML_ENGINE_WORKERS=2
      - ML_RISK_THRESHOLD_LOW=40
      - ML_RISK_THRESHOLD_HIGH=70
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - pramana-net

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: pramana-auth-service
    restart: always
    environment:
      - AUTH_SERVICE_HOST=0.0.0.0
      - AUTH_SERVICE_PORT=8004
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - BCRYPT_ROUNDS=14
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pramana-net

  nginx:
    image: nginx:1.25-alpine
    container_name: pramana-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
    networks:
      - pramana-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  pramana-net:
    driver: bridge
